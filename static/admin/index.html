<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configure Lyra</title>
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/vendor/msal.js" defer></script>
  <script src="/entra.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/admin/" aria-label="Lyra configuration home"><span class="mark" aria-hidden="true">✦</span> Lyra <span class="divider"></span><small>Configuration</small></a>
    <div class="actions"><a class="workspace-link" href="/">Back to chat</a><button type="button" id="account" disabled>Sign in</button></div>
  </header>
  <div class="layout">
  <aside id="sidebar" hidden>
    <div class="rail">
      <button type="button" id="nav-toggle" aria-controls="workspace-nav" aria-expanded="false" aria-label="Expand navigation" title="Expand navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        <span class="nav-label">Workspace</span>
      </button>
      <nav id="workspace-nav" aria-label="Configuration">
        <a href="/admin/agents/" title="Agents" aria-label="Agents">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M12 3v4M8 12v2m8-2v2m-7 4h6"/></svg>
          <span class="nav-label">Agents</span>
        </a>
        <a href="/admin/prompts/" title="PromptStudio" aria-label="PromptStudio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM9 11h6m-6 4h6"/></svg>
          <span class="nav-label">PromptStudio</span>
        </a>
        <a href="/admin/models/" title="Models" aria-label="Models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM8 10h8"/></svg><span class="nav-label">Models</span></a>
        <a href="/admin/model-groups/" title="Model groups" aria-label="Model groups"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h13v11H3zM7 19h13V8"/></svg><span class="nav-label">Model groups</span></a>
        <a href="/admin/protocols/" title="Protocols" aria-label="Protocols"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg><span class="nav-label">Protocols</span></a>
        <a href="/admin/providers/" title="Providers" aria-label="Providers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0Zm6 9v4"/></svg>
          <span class="nav-label">Providers</span>
        </a>
        <a href="/admin/flow/" title="Flow View" aria-label="Flow View">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/><path d="M6.5 9v6a3 3 0 0 0 3 3H14"/></svg>
          <span class="nav-label">Flow View</span>
        </a>
      </nav>
    </div>
  </aside>
  <main>
    <div id="admin-navigation" hidden>
      <div class="history-controls">
        <button id="admin-back" type="button" aria-label="Go back" title="Go back">←</button>
        <button id="admin-forward" type="button" aria-label="Go forward" title="Go forward">→</button>
      </div>
      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
    </div>
    <div class="eyebrow">ADMIN WORKSPACE</div>
    <h1>Configure Lyra</h1>
    <p id="status" role="status">Checking access…</p>
    <div id="workspace" hidden>
    <section id="home-page" aria-labelledby="overview">
      <h2 id="overview">Current configuration</h2>
      <dl>
        <dt>Chat model</dt><dd data-model></dd>
        <dt>Prompt library</dt><dd data-library></dd>
      </dl>
    </section>
    <section id="models-page" hidden aria-label="models"></section>
    <section id="model-groups-page" hidden aria-label="model-groups"></section>
    <section id="protocols-page" hidden aria-label="protocols"></section>
    <section id="providers-page" hidden aria-label="providers"></section>
    <section id="flow-page" hidden aria-label="Flow editor">
      <div id="flow-editor"></div>
    </section>
    <section id="agents-page" hidden aria-label="Agent definitions"></section>
    <section id="prompts-page" hidden aria-label="Prompt library"></section>
    </div>
  </main>
  </div>
</body>
</html>
